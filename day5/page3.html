<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pravah Skit Event Registration</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    margin:0;
}

.container{
    width:80%;
    margin:20px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
}

h1{
    text-align:center;
    color:#003366;
}

h2{
    color:#003366;
    border-bottom:2px solid #003366;
    padding-bottom:5px;
}

form{
    margin-top:15px;
}

label{
    font-weight:bold;
}

input,select{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border:1px solid gray;
    border-radius:5px;
}

button{
    background:#003366;
    color:white;
    padding:10px 20px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0055aa;
}

ul{
    line-height:30px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

table,th,td{
    border:1px solid black;
}

th{
    background:#003366;
    color:white;
    padding:10px;
}

td{
    padding:10px;
    text-align:center;
}

.count{
    background:#003366;
    color:white;
    padding:10px;
    width:250px;
    border-radius:5px;
    margin-top:10px;
}
</style>

</head>

<body>

<div class="container">

<h1>🎭 Pravah Skit Event Registration</h1>

<h2>Registration Form</h2>

<form>

<label>Full Name</label>
<input type="text" placeholder="Enter your name">

<label>Email</label>
<input type="email" placeholder="Enter your email">

<label>Phone Number</label>
<input type="tel" placeholder="Enter your phone number">

<label>College</label>
<input type="text" placeholder="Enter college name">

<label>Select Event</label>
<select>
<option>Skit Competition</option>
<option>Drama</option>
<option>Mono Act</option>
<option>Mime</option>
<option>Street Play</option>
</select>

<button type="submit">Register</button>

</form>

<h2>Events List</h2>

<ul>
<li>Skit Competition</li>
<li>Drama</li>
<li>Mono Act</li>
<li>Mime</li>
<li>Street Play</li>
</ul>
