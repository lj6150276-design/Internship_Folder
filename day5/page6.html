<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pravah 2027 Registration</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

</head>
<body>

<div class="circle one"></div>
<div class="circle two"></div>

<section class="container">

<div class="left">

<h1>PRAVAH <span>2027</span></h1>

<p class="tagline">
Innovation • Creativity • Competition
</p>

<div class="info">

<div class="card">
<h2>📅 Date</h2>
<p>10 July 2027</p>
</div>

<div class="card">
<h2>📍 Destination</h2>
<p>SKIT Campus</p>
</div>

<div class="card">
<h2>🎯 Event</h2>
<p>Inter College Fest</p>
</div>

</div>

</div>


<div class="right">

<form>

<h2>Register Now</h2>

<input type="text" placeholder="Full Name" required>

<input type="email" placeholder="Email Address" required>

<input type="number" placeholder="Phone Number" required>

<select>

<option>Select Event</option>

<option>Hackathon</option>

<option>Web Development</option>

<option>Gaming</option>

<option>Dance</option>

<option>Singing</option>

<option>Poster Making</option>

<option>Photography</option>

</select>


<select>

<option>Number of Members</option>

<option>1</option>

<option>2</option>

<option>3</option>

<option>4</option>

<option>5</option>

<option>6</option>

</select>

<div class="members">

<input type="text" placeholder="Member 1 Name">

<input type="text" placeholder="Member 2 Name">

<input type="text" placeholder="Member 3 Name">

<input type="text" placeholder="Member 4 Name">

<input type="text" placeholder="Member 5 Name">

<input type="text" placeholder="Member 6 Name">

</div>

<button>Register</button>

</form>

</div>

</section>

</body>
</html>
