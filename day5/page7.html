<!-- ================= ABOUT ================= -->

<section id="about" class="container py-5">

<h2 class="text-center mb-5">

Events

</h2>

<div class="row g-4">

<div class="col-md-3">

<div class="card event-card">

<div class="card-body">

<h5>Skit</h5>

</div>

</div>

<div class="col-md-3">

<!-- ================= FORM ================= -->

<section id="register" class="container py-5">

<div class="form-box">

<h2 class="text-center mb-4">

Student Registration

</h2>

<form id="registrationForm">

<div class="row">

<div class="col-md-6">

<label>Name</label>

<input
type="text"
class="form-control"
required>

</div>

<div class="col-md-6">

<label>College</label>

<input
type="text"
class="form-control"
required>

</div>

</div>

<br>

<div class="row">

<div class="col-md-6">

<label>Email</label>

<input
type="email"
class="form-control"
required>

</div>

<div class="col-md-6">

<label>Phone</label>

<input
type="number"
class="form-control"
required>

</div>

</div>

<br>

<label>Select Event</label>

<select class="form-select">

<option>Skit</option>

<option>Dance</option>

<option>Drama</option>

<option>Singing</option>

<option>Mime</option>

</select>

<br>

<label>Number of Members</label>

<select
id="members"
class="form-select">

<option value="1">1</option>

<option value="2">2</option>

<option value="3">3</option>

<option value="4">4</option>

<option value="5">5</option>

<option value="6">6</option>

</select>

<br>

<div id="memberFields">

</div>

<button
class="btn btn-warning w-100 mt-3">

Register

</button>

</form>

</div>

</section>
