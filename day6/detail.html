<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">
    <h2 class="text-center mb-4">Student Records</h2>

    <input
        type="text"
        id="search"
        class="form-control mb-4"
        placeholder="Search Student"
    >

    <div id="container" class="row g-4"></div>
</div>

<script>
const students = [
    { name: "Harshvardhan choudhary", branch: "CSE", cgpa: 8.4 },
    { name: "Harshvardhan nathawat", branch: "ECE", cgpa: 7.9 },
    { name: "Lakshay jain", branch: "IT", cgpa: 9.1 },
    { name: "Harsh goyal", branch: "AI", cgpa: 9.0 },
    { name: "Ankit jain", branch: "DS", cgpa: 8.1 },
    { name: "Dhruv rathore", branch: "IOT", cgpa: 8.6 },
    { name: "Kishor kumar", branch: "ME", cgpa: 8.9 },
    { name: "Dharmik jain", branch: "CSE", cgpa: 8.2 },
    { name: "Prince jain", branch: "ME", cgpa: 10.0 }
    
];

let html = "";

students.forEach((student, i) => {
    html += `
        <div class="col-md-4 card-item">
            <div class="card shadow">
                <div class="card-body">
                    <h5>${student.name}</h5>

                    <button class="btn btn-primary btn-sm mt-2"
                        onclick="toggleDetails(${i})">
                        Show Details
                    </button>

                    <div id="details-${i}" class="details mt-3" style="display:none;">
                        <p><strong>Branch:</strong> ${student.branch}</p>
                        <p><strong>CGPA:</strong> ${student.cgpa}</p>
                    </div>
                </div>
            </div>
        </div>
    `;
});

document.getElementById("container").innerHTML = html;

function toggleDetails(index) {
    const details = document.getElementById(`details-${index}`);

    if (details.style.display === "none") {
        details.style.display = "block";
    } else {
        details.style.display = "none";
    }
}

document.getElementById("search").addEventListener("keyup", function () {

    let filter = this.value.toLowerCase();
    let cards = document.querySelectorAll(".card-item");

    cards.forEach(function(card) {
        let name = card.querySelector("h5").innerText.toLowerCase();

        if (name.includes(filter)) {
            card.style.display = "block";
        } else {
            card.style.display = "none";
        }
    });

});
</script>

</body>
</html>
